services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: real_estate_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - real_estate_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: real_estate_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    networks:
      - real_estate_network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: real_estate_kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - real_estate_network

  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - real_estate_network
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Kafka...'
      while ! kafka-topics --bootstrap-server kafka:9092 --list; do
        sleep 1
      done
      
      echo 'Creating topic new_listings...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic new_listings --partitions 3 --replication-factor 1
      
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  seed-data-loader:
    image: pgvector/pgvector:pg16
    container_name: real_estate_seed_loader
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    networks:
      - real_estate_network
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-mlops123}
    command: ["/bin/bash", "/scripts/auto_load_seed_data.sh"]
    restart: "no"

  data_loader:
    build: ./services/data_loader
    container_name: real_estate_data_loader
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
      - RAPIDAPI_HOST=${RAPIDAPI_HOST:-airbnb19.p.rapidapi.com}
      - PLACE_ID=${PLACE_ID:-}
      - MAX_LISTINGS=${MAX_LISTINGS:-4120}
      - MAX_IMAGES_PER_LISTING=${MAX_IMAGES_PER_LISTING:-20}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-real_estate}
      - POSTGRES_USER=${POSTGRES_USER:-mlops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlops123}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=new_listings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    networks:
      - real_estate_network

  ml_inference:
    build: ./services/ml_inference
    container_name: real_estate_ml_inference
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-real_estate}
      - POSTGRES_USER=${POSTGRES_USER:-mlops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlops123}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MODEL_PATH=/app/models/model.cbm
      - PREPROCESSOR_PATH=/app/models/preprocessor.pkl
    networks:
      - real_estate_network

  ml_inference_consumer:
    build: ./services/ml_inference
    container_name: real_estate_ml_consumer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml_inference:
        condition: service_started
    command: python run_consumer.py
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-real_estate}
      - POSTGRES_USER=${POSTGRES_USER:-mlops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlops123}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MODEL_PATH=/app/models/model.cbm
      - PREPROCESSOR_PATH=/app/models/preprocessor.pkl
    networks:
      - real_estate_network
    restart: unless-stopped

  ui:
    build: ./services/ui
    container_name: real_estate_ui
    depends_on:
      postgres:
        condition: service_healthy
      ml_inference:
        condition: service_started
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-real_estate}
      - POSTGRES_USER=${POSTGRES_USER:-mlops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mlops123}
      - ML_INFERENCE_URL=http://ml_inference:8000
    networks:
      - real_estate_network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: real_estate_grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - real_estate_network

networks:
  real_estate_network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:

